name: archivero-dev

x-environment: &environment
  DOTNET_ENVIRONMENT: Development
  ConnectionStrings__ArchiveroDB: 'Server=localhost,${SQL_PORT:-1435};Database=${SQL_DATABASE:-ArchiveroDockerDev};User ID=${SQL_ADMIN_USER:-sa};Password="${SQL_ADMIN_PASSWORD:?Set SQL_ADMIN_PASSWORD}";Encrypt=True;TrustServerCertificate=True'
  ArchiveroBlobService__ConnectionString: 'DefaultEndpointsProtocol=http;AccountName=${BLOB_ACCOUNT_NAME:-devstoreaccount1};AccountKey=${BLOB_ACCOUNT_KEY:?Set BLOB_ACCOUNT_KEY};BlobEndpoint=http://localhost:${BLOB_PORT:-10000}/${BLOB_ACCOUNT_NAME:-devstoreaccount1};'
  ArchiveroBlobService__ContainerName: '${BLOB_CONTAINER_NAME:-archivero}'
  ArchiveroFileBus__ConnectionString: 'Endpoint=sb://localhost:${SERVICEBUS_PORT:-5672};SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;'
  ArchiveroFileBus__CreateWordFileQueueName: createwordfilequeue
  ArchiveroFileBus__DeleteWordFileQueueName: deletewordfilequeue

services:
  backend:
    image: archivero/backend-api:debug
    build:
      context: ..
      dockerfile: src/Demo.Archivero.Backend.Api/Dockerfile
    network_mode: host
    environment:
      <<: *environment
      ASPNETCORE_URLS: http://+:50950
      ArchiveroAuth__AdminUsername: '${APP_ADMIN_USERNAME:?Set APP_ADMIN_USERNAME}'
      ArchiveroAuth__AdminPassword: '${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD}'
      ArchiveroJwt__Issuer: Archivero.Api
      ArchiveroJwt__Audience: Archivero.Client
      ArchiveroJwt__SigningKey: '${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}'
      ArchiveroJwt__ExpirationMinutes: '480'
      Database__EnsureCreatedOnStartup: 'true'
      Redis__Hosts__0__Host: localhost
      Redis__Hosts__0__Port: '${REDIS_PORT:-6379}'
      Redis__Password: ''
      Redis__Ssl: 'false'
      Redis__AllowAdmin: 'true'
      Redis__ConnectTimeout: '5000'
      Redis__SyncTimeout: '5000'
      Redis__Database: '0'
      Redis__PoolSize: '5'
      Redis__IsDefault: 'true'
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy
      servicebus:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:50950/api/health >/dev/null && curl -fsS http://localhost:${EMULATOR_HTTP_PORT:-5300}/health >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: archivero/frontend-spa:debug
    build:
      context: ..
      dockerfile: src/Demo.Archivero.Frontend.Spa/Dockerfile
    network_mode: host
    environment:
      ASPNETCORE_URLS: http://+:50952
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: archivero/converter-worker:debug
    build:
      context: ..
      dockerfile: src/Demo.Archivero.Converter.Worker/Dockerfile
    network_mode: host
    environment:
      <<: *environment
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: '${ACCEPT_EULA:?Set ACCEPT_EULA}'
      MSSQL_SA_PASSWORD: '${SQL_ADMIN_PASSWORD:?Set SQL_ADMIN_PASSWORD}'
      MSSQL_PID: StandardDeveloper
    ports:
      - '${SQL_PORT:-1435}:1433'
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: '${ACCEPT_EULA:?Set ACCEPT_EULA}'
      MSSQL_SA_PASSWORD: '${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}'
    volumes:
      - servicebus-sql-data:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - '${CONFIG_PATH:-./AzureServiceBusEmulator/Config.json}:/ServiceBus_Emulator/ConfigFiles/Config.json:ro'
    ports:
      - '${SERVICEBUS_PORT:-5672}:5672'
      - '${EMULATOR_HTTP_PORT:-5300}:5300'
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: '${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}'
      ACCEPT_EULA: '${ACCEPT_EULA:?Set ACCEPT_EULA}'
      SQL_WAIT_INTERVAL: '${SQL_WAIT_INTERVAL:-30}'
      EMULATOR_HTTP_PORT: '5300'
    depends_on:
      sqledge:
        condition: service_healthy
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    environment:
      AZURITE_ACCOUNTS: '${BLOB_ACCOUNT_NAME:-devstoreaccount1}:${BLOB_ACCOUNT_KEY:?Set BLOB_ACCOUNT_KEY}'
    ports:
      - '${BLOB_PORT:-10000}:10000'
    volumes:
      - blob-data:/data
    healthcheck:
      test: [CMD, node, -e, "const s=require('net').connect(10000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  sql-data:
  servicebus-sql-data:
  blob-data:
  redis-data:
